<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Inkwell — Draw together, live</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖋️</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- ===== Join Overlay ===== -->
  <div id="join-overlay" class="overlay">
    <div class="join-card">
      <div class="brand">
        <span class="brand-mark">✒️</span>
        <span class="brand-word">Inkwell</span>
      </div>
      <p class="join-sub">A shared canvas, live. Pick a name and a room to start drawing together.</p>

      <label class="field-label" for="name-input">Your name</label>
      <input id="name-input" class="field" type="text" maxlength="24" placeholder="e.g. Vij" autocomplete="off" />

      <label class="field-label" for="room-input">Room code</label>
      <div class="room-row">
        <input id="room-input" class="field" type="text" maxlength="40" placeholder="e.g. studio-42" autocomplete="off" />
        <button id="new-room-btn" class="ghost-btn" type="button" title="Generate a new room code">New</button>
      </div>

      <button id="join-btn" class="primary-btn" type="button">Enter the room</button>
      <p class="join-hint">Share the room code with a friend to draw together in real time.</p>
    </div>
  </div>

  <!-- ===== App Shell ===== -->
  <div id="app" class="app hidden">

    <!-- Top bar -->
    <header class="topbar">
      <div class="brand small">
        <span class="brand-mark">✒️</span>
        <span class="brand-word">Inkwell</span>
      </div>

      <div class="room-pill" id="room-pill" title="Click to copy invite link">
        <span class="dot" id="conn-dot"></span>
        <span id="room-label">room</span>
        <span class="copy-hint">copy invite</span>
      </div>

      <div class="presence" id="presence-list"></div>
    </header>

    <!-- Canvas -->
    <main class="canvas-wrap">
      <canvas id="board"></canvas>
      <div id="cursor-layer"></div>
      <div id="toast" class="toast hidden"></div>
    </main>

    <!-- Floating toolbar -->
    <footer class="toolbar">
      <div class="tool-group">
        <button class="tool-btn active" data-tool="pen" title="Pen">
          <svg viewBox="0 0 24 24"><path d="M3 21l3.6-1 12-12-2.6-2.6-12 12L3 21z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14.6 4.9l4.5 4.5" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
        <button class="tool-btn" data-tool="brush" title="Brush">
          <svg viewBox="0 0 24 24"><path d="M7 17c-1 2-3 2.5-4 2.5 1.3-.8 1-2.7 1.8-4a2.6 2.6 0 014.6 1.2C9.4 18 8 18.6 7 17z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.5 14.5L19 5a1.8 1.8 0 00-2.5-2.5L7 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool-btn" data-tool="highlighter" title="Highlighter">
          <svg viewBox="0 0 24 24"><path d="M3 21l1-4 12-12 3 3-12 12-4 1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><rect x="14.5" y="3.5" width="3" height="6" transform="rotate(45 16 6.5)" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="tool-btn" data-tool="eraser" title="Eraser">
          <svg viewBox="0 0 24 24"><path d="M18 13l-7 7H6l-3-3 10-10 8 8-3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="tool-group">
        <button class="tool-btn" data-tool="line" title="Line">
          <svg viewBox="0 0 24 24"><path d="M5 19L19 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="tool-btn" data-tool="rectangle" title="Rectangle">
          <svg viewBox="0 0 24 24"><rect x="4.5" y="6" width="15" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
        <button class="tool-btn" data-tool="circle" title="Circle">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
        <button class="tool-btn" data-tool="text" title="Text">
          <svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="tool-group swatches" id="swatches"></div>

      <div class="tool-group size-group">
        <input id="size-range" type="range" min="2" max="36" value="6" />
        <span id="size-label">6px</span>
      </div>

      <div class="tool-group">
        <button class="tool-btn" id="names-toggle" title="Show who drew what">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 6v11a2 2 0 002 2h6M4 6l2-3h12l2 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 21l6-6M15.5 13.5l3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="tool-group">
        <button class="tool-btn" id="undo-btn" title="Undo my last stroke">
          <svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 010 10h-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool-btn" id="clear-btn" title="Clear the board for everyone">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool-btn" id="save-btn" title="Save as PNG">
          <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
